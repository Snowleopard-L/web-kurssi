
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harjoitukset- Lapuan Lepakot</title>
    <link rel="stylesheet" href="style.css">
    <script src="form.js"></script>
</head>

<body>

    <header>
        <h1>LAPUAN LEPAKOT</h1>
    </header>

    <main>
<section id="harjoitukset">
            <h2>Harjoitusajat</h2>

            <p><strong>Juniorit:</strong> Tiistaisin klo 17:00–18:30</p>
            <p><strong>Miehet:</strong> Keskiviikkoisin klo 19:00–20:30</p>
            <p><strong>Naiset:</strong> Torstaisin klo 18:00–19:30</p>
        </section>
        
        <section id="ilmoittautuminen">
            <h2>Tule mukaan kokeilemaan!</h2>

            <p>
                Ilmoittaudu maksuttomaan kokeiluharjoitukseen.
                Aikaisempaa kokemusta ei tarvita!
            </p>
            
            <form id="ilmoittautumislomake" onsubmit="return process()">
                
                <label for="fname">Etunimi:</label>
                <input type="text" id="fname" name="fname" required>

                <label for="lname">Sukunimi:</label>
                <input type="text" id="lname" name="lname" required>

                <label for="email">Sähköposti:</label>
                <input type="email" id="email" name="email" required>

                <label for="joukkue">Mihin joukkueeseen haluat?</label>
                <select id="joukkue" name="joukkue" required>
                    <option value="">Valitse joukkue</option>
                    <option value="juniorit">Juniorit</option>
                    <option value="miehet">Miehet</option>
                    <option value="naiset">Naiset</option>
                </select>

                <button type="submit">Ilmoittaudu</button>
                <div id="message"></div>
                <p id="lomakeviesti"></p>

            </form>
        </section>

    </main>

    <footer>
        <p>Lapuan Lepakot ry © 2026</p>
    </footer>

</body>
</html>
